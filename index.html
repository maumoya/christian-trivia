<style>
/* Layout: one screen — top strip (name + 8 day cards), the world canvas, the story panel under it. Single storybook look by choice (the world itself goes dark to golden). */
:root{
  --dusk:#0b1424;      /* the deep before day 1: page ground */
  --paper:#f3f7ff;     /* story panel */
  --ink:#1b2340;
  --muted:#58628a;
  --sun:#ffc93c;       /* the one bold accent: light */
  --sun-deep:#d99a00;
  --sea:#2f6fb0;
  --leaf:#3f9d5a;
  --ghost:#d5dbea;
  --display:"Grandstander","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--dusk);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.app{min-height:100%;max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-block:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.name{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.06em;color:var(--sun);margin:0;line-height:1}
.name small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9fb0d6;font-family:var(--body);font-weight:700;margin-top:3px}
.cards{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.slot{width:34px;height:42px;border-radius:7px;border:2px dashed #34456b;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#34456b;font-size:15px}
.slot.on{border:2px solid var(--sun);background:var(--sun);color:var(--ink);box-shadow:0 0 14px rgba(255,201,60,.45)}
.tools{display:flex;gap:6px}
.tool{background:#1a2742;color:#dfe7fb;border:1px solid #34456b;border-radius:999px;padding:7px 12px;font:700 13px var(--body);cursor:pointer}
.tool[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#08111f;box-shadow:0 10px 40px rgba(0,0,0,.45)}
canvas{display:block;width:100%;height:auto;aspect-ratio:1000/560;max-width:100%;cursor:pointer;touch-action:manipulation}
.panel{background:var(--paper);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0;text-wrap:balance;line-height:1.15}
.eyebrow{font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.story{font-size:20px;max-width:65ch;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:800 18px var(--display);border:0;border-radius:14px;padding:12px 22px;cursor:pointer;background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sun-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--sun-deep)}
.btn.quiet{background:#e3e9f8;box-shadow:0 4px 0 #c3cce3}
.tip{font-size:15px;color:var(--muted);margin:0}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ans{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;border:3px solid #c9d3ec;background:#fff;cursor:pointer;font:700 17px var(--body);color:var(--ink)}
.ans .pic{font-size:40px;line-height:1}
.ans:hover{border-color:var(--sea)}
.ans.no{opacity:.4;border-style:dashed;cursor:default}
.ans.yes{border-color:var(--leaf);background:#e6f6ea}
.hint{background:#fff6d6;border-radius:12px;padding:10px 14px;margin:0;font-size:17px}
.won{display:flex;gap:14px;align-items:center}
.won .big{width:58px;height:70px;border-radius:10px;background:var(--sun);display:grid;place-items:center;font:800 26px var(--display);box-shadow:0 0 22px rgba(255,201,60,.6);flex:none}
.recap{display:flex;gap:8px;flex-wrap:wrap}
.recap span{background:#fff;border:2px solid var(--sun);border-radius:10px;padding:6px 10px;font-size:15px;font-weight:700}
blockquote{margin:0;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.3;max-width:40ch}
cite{display:block;font:700 13px var(--body);color:var(--muted);font-style:normal;margin-top:4px;letter-spacing:.04em}
select,input{font:700 16px var(--body);padding:8px 10px;border-radius:10px;border:2px solid #c9d3ec;background:#fff;color:var(--ink)}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
dialog{border:0;border-radius:18px;padding:22px;max-width:min(460px,calc(100% - 32px));background:var(--paper);color:var(--ink)}
dialog::backdrop{background:rgba(5,10,20,.7)}
dialog h3{font-family:var(--display);margin:0 0 8px;font-size:22px}
.list{margin:0;padding-left:18px;font-size:15px;color:var(--muted)}
.list li+li{margin-top:4px}
@media (max-width:560px){
  .story{font-size:18px}
  .ans{padding:10px 4px;font-size:14px}
  .ans .pic{font-size:32px}
  .slot{width:28px;height:36px;font-size:13px}
  .name{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>

  // day 3: land and plants
  if(a3>0){ctx.save();ctx.translate(0,(1-a3)*260);
    const g=ctx.createLinearGradient(0,260,0,H);g.addColorStop(0,"#6cc46f");g.addColorStop(1,"#2f7d43");ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,320);ctx.quadraticCurveTo(170,250,360,315);ctx.quadraticCurveTo(540,372,700,332);ctx.lineTo(760,H);ctx.closePath();ctx.fill();
    tree(70,318,a3,"#2f8a4c","#47b062","#e5484d");tree(225,296,a3*.9);tree(660,350,a3*.8,"#2f8a4c","#47b062","#f2a33a");
    ctx.fillStyle="#ffe066";[[120,360],[300,350],[410,372],[520,385],[600,370],[180,380]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,4*a3,0,7);ctx.fill();});
    ctx.restore();}
  // day 5: sea creatures and birds
  if(a5>0){const m=reduce?0:time;
    [[820,420,32],[900,500,28],[760,520,26],[960,400,24]].forEach(([x,y,s],k)=>emoji("🐟",x+Math.sin(m*.8+k)*30,y+Math.sin(m*1.3+k)*6,s,a5));
    emoji("🐋",880+Math.sin(m*.3)*40,470,64,a5);
    [[300,90],[420,140],[640,70]].forEach(([x,y],k)=>emoji("🕊️",(x+m*25*(k+1))%1060-30,y+Math.sin(m*2+k)*8,30,a5));}
  // day 6: land animals
  if(a6>0){[["🐄",120,388,40],["🐑",300,370,34],["🦁",470,402,40],["🐇",560,410,28],["🐌",390,412,24],["🐎",620,392,38]].forEach(([c,x,y,s],k)=>emoji(c,x,y-(reduce?0:Math.abs(Math.sin(time*2+k))*3),s,a6));}
  // day 6 (people): the garden
  if(a7>0 && S.i>=6){ctx.globalAlpha=a7;ctx.strokeStyle="#6bc0ef";ctx.lineWidth=16;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(430,300);ctx.quadraticCurveTo(380,430,250,560);ctx.stroke();
    const g=ctx.createRadialGradient(470,270,5,470,270,90);g.addColorStop(0,"rgba(255,226,120,.8)");g.addColorStop(1,"rgba(255,226,120,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(470,270,90,0,7);ctx.fill();
    tree(470,345,1.15,"#3a9b55","#5cc070","#ffd23f");tree(545,352,1,"#2c7a44","#3f9d5a","#c0392b");ctx.globalAlpha=1;
    // the people
    const w=walker;
    if(S.i===6&&S.screen==="scene"){
    if(w.beam>0){ctx.fillStyle=`rgba(255,240,180,${w.beam*.7})`;ctx.fillRect(W7.dust-40,0,80,W7.feet);}
    if(w.step>=2 && S.i===6) ANIMALS.forEach(([c],k)=>{ if(k<w.shown){const [x,y]=ANIMAL_POS[k];const done=w.named.includes(k);emoji(c,x,y,done?34:40,done?.55:1);}});
    if(w.alpha>0){const moving=Math.abs(w.tx-w.x)>2;person(w.x,W7.feet,{alpha:w.alpha,lying:w.sleep,bob:moving&&!reduce?Math.abs(Math.sin(time*10))*3:0});}
    if(w.woman>0)person(w.x+46,W7.feet,{alpha:w.woman,hair:"#3b2414",skin:"#a96b42",cloth:"#d9e8c4"});
    if(w.label&&time<w.label.until)bubble(w.label.x,w.label.y-24,w.label.text);
    if(w.bubble&&time<w.bubble)bubble(w.x,W7.feet-80,S.lang==="es"?"¡Por fin!":"At last!");
    }
  }
  // day 7: golden rest
  if(a8>0){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgba(255,170,80,${.45*a8})`);g.addColorStop(1,`rgba(255,120,60,${.25*a8})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    person(300,432,{alpha:a8});person(346,432,{alpha:a8,hair:"#3b2414",skin:"#a96b42",cloth:"#d9e8c4"});}

  // the next thing to tap
  if(S.screen==="scene"&&S.phase==="explore"){
    const sc=SCENES[S.i];
    if(!sc.walk&&world.v>=world.target-.001) glowSpot(sc.spot[0],sc.spot[1],time);
    if(sc.walk){const w=walker; const next=w.step===0?W7.dust:w.step===1?W7.naming:w.step===3?W7.woman:null; if(next!==null&&world.v>=7) glowSpot(next,W7.feet-30,time);}
  }
  stepWalker(dt,time);
  requestAnimationFrame(draw);
}

/* ---------- scene 7: walking ---------- */
function stepWalker(dt,time){
  const w=walker; if(S.screen!=="scene"||S.i!==6) return;
  w.beam=Math.max(0,w.beam-dt*.6);
  if(w.step>=1&&w.alpha<1) w.alpha=Math.min(1,w.alpha+dt*.8);
  if(w.step===1||w.step===3){const d=w.tx-w.x;w.x+=Math.sign(d)*Math.min(Math.abs(d),dt*170);}
  if(w.step===2&&w.shown<ANIMALS.length){w.timer=(w.timer||0)+dt;if(w.timer>(reduce?.05:.35)){w.timer=0;w.shown++;}}
  if(w.step===1&&Math.abs(w.x-W7.naming)<8){w.step=2;w.shown=0;renderPanel();say(t("name"));}
  if(w.step===3&&Math.abs(w.x-W7.woman)<8){w.step=4;w.sleep=1;
    setTimeout(()=>{w.beam=1;w.woman=0;const fade=setInterval(()=>{w.woman=Math.min(1,w.woman+.05);if(w.woman>=1)clearInterval(fade);},40);},900);
    setTimeout(()=>{w.sleep=0;w.bubble=performance.now()/1000+3;},1900);
    setTimeout(()=>{if(S.i===6)toQuestions();},3600);}
}
function onWorldTap(x,y){
  if(S.screen!=="scene"||S.phase!=="explore")return;
  const sc=SCENES[S.i];
  if(!sc.walk){ if(world.v<world.target-.001)return; if(Math.hypot(x-sc.spot[0],y-sc.spot[1])<110) reveal(); else flashTip(); return; }
  const w=walker; if(world.v<7)return;
  if(w.step===0){ if(Math.abs(x-W7.dust)<90){w.beam=1;w.step=1;w.x=w.tx=W7.dust;} else flashTip(); return; }
  if(w.step===2){
    let hit=-1;ANIMAL_POS.forEach(([ax,ay],k)=>{if(k<w.shown&&Math.hypot(x-ax,y-ay)<36)hit=k;});
    if(hit>=0&&!w.named.includes(hit)){w.named.push(hit);const n=ANIMALS[hit][S.lang==="es"?2:1];w.label={text:n,x:ANIMAL_POS[hit][0],y:ANIMAL_POS[hit][1],until:performance.now()/1000+1.6};say(n);
      if(!S.stickers.includes(hit))S.stickers.push(hit);save();
      if(w.named.length===ANIMALS.length){w.step=3;setTimeout(()=>{renderPanel();say(t("walk"));},900);} renderPanel();}
    return;
  }
  if(w.step===1||w.step===3){ if(y>300) w.tx=clamp(x,60,700); }
}
let tipTimer;
function flashTip(){const el=document.getElementById("tip");if(!el)return;el.style.color="var(--sea)";clearTimeout(tipTimer);tipTimer=setTimeout(()=>el.style.color="",900);}

/* ---------- flow ---------- */
const shuffle = a => a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
function enter(i){
  S.screen="scene";S.i=i;S.phase="explore";S.qi=0;S.wrong=[];
  world.target = i===6 ? 7 : i; if(world.v>world.target) world.v=world.target;
  if(i===6) Object.assign(walker,{step:0,x:W7.dust,tx:W7.dust,alpha:0,beam:0,shown:0,named:[],sleep:0,woman:0,bubble:0,label:null});
  save();renderPanel();say(L(SCENES[i].nar));
}
function reveal(){world.target=S.i+1;setTimeout(toQuestions,reduce?300:1500);}
function toQuestions(){S.phase="q";S.qi=0;setQ();}
function setQ(){S.wrong=[];S.opts=shuffle(SCENES[S.i].qs[S.qi].a.map((_,k)=>k));renderPanel();say(L(SCENES[S.i].qs[S.qi].q));}
function answer(k){
  const q=SCENES[S.i].qs[S.qi];const a=q.a[k];
  if(S.phase!=="q"||S.wrong.includes(k))return false;
  if(a.ok){
    const p=t("praise");say(p[Math.floor(Math.random()*p.length)]);
    if(S.qi<SCENES[S.i].qs.length-1){S.qi++;setTimeout(setQ,700);renderPanel(k);return true;}
    if(!S.cards.includes(S.i))S.cards.push(S.i);S.phase="done";S.best=Math.max(S.best,S.i+1);save();renderPanel();return true;
  }
  S.wrong.push(k);renderPanel();say(L(q.hint));return false;
}
function next(){ if(S.i<7) enter(S.i+1); else finish(); }
function finish(){S.screen="end";world.target=8;save();renderPanel();say(t("doneT")+". "+t("stop"));}

/* ---------- panel ---------- */
const panel=document.getElementById("panel");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderCards(){
  document.getElementById("cards").innerHTML=SCENES.map((s,k)=>`<span class="slot${S.cards.includes(k)?" on":""}" title="${esc(L(s.card))}">${s.day}</span>`).join("");
  document.getElementById("langBtn").textContent=S.lang==="en"?"ES":"EN";
  document.getElementById("soundBtn").setAttribute("aria-pressed",String(S.sound));
}
function renderPanel(justRight){
  renderCards();
  if(S.screen==="start"){
    const resume=S.best>0&&S.best<8;
    panel.innerHTML=`<div class="eyebrow">${t("genesis")}</div><h2>${esc(t("intro"))}</h2>
      <div class="row"><button class="btn" id="go" type="button">${t("start")}</button>${resume?`<button class="btn quiet" id="resume" type="button">${t("cont")} · ${S.best+1}/8</button>`:""}</div>`;
    panel.querySelector("#go").onclick=()=>{S.cards=[];S.best=0;world.v=0;enter(0);};
    if(resume)panel.querySelector("#resume").onclick=()=>{world.v=S.best===6?6:S.best;enter(S.best);};
    return;
  }
  if(S.screen==="end"){
    const trs=S.lang==="es"?["RVR1909"]:["KJV","WEB"]; if(!trs.includes(S.trans))S.trans=trs[0];
    panel.innerHTML=`<div class="eyebrow">${t("genesis")}</div><h2>${t("doneT")}</h2>
      <div class="recap">${SCENES.map(s=>`<span>${esc(L(s.card))}</span>`).join("")}</div>
      <div class="row"><button class="btn quiet" id="readAll" type="button">🔊 ${t("read")}</button></div>
      <div><div class="eyebrow">${t("verse")} · ${S.lang==="es"?"Génesis":"Genesis"} 1:1</div>
      <blockquote>${esc(VERSE[S.trans])}<cite>${S.trans}</cite></blockquote>
      ${trs.length>1?`<div class="row" style="margin-top:8px"><select id="trans" aria-label="Translation">${trs.map(x=>`<option${x===S.trans?" selected":""}>${x}</option>`).join("")}</select><button class="btn quiet" id="sayVerse" type="button">🔊 ${t("listen")}</button></div>`:`<div class="row" style="margin-top:8px"><button class="btn quiet" id="sayVerse" type="button">🔊 ${t("listen")}</button></div>`}</div>
      <div><div class="eyebrow">${t("today")}</div><p class="story">${esc(L(TODAY))}</p></div>
      <h2>${t("stop")}</h2>
      <div class="row"><button class="btn quiet" id="again" type="button">${t("again")}</button></div>`;
    panel.querySelector("#readAll").onclick=()=>say(SCENES.map(s=>L(s.card)).join(". "));
    panel.querySelector("#sayVerse").onclick=()=>say(VERSE[S.trans]);
    const sel=panel.querySelector("#trans");if(sel)sel.onchange=e=>{S.trans=e.target.value;save();renderPanel();};
    panel.querySelector("#again").onclick=()=>{S.cards=[];S.best=0;world.v=0;world.target=0;S.screen="start";save();renderPanel();};
    return;
  }
  const sc=SCENES[S.i];
  const head=`<div class="eyebrow">${S.lang==="es"?"Escena":"Scene"} ${S.i+1} / 8 · ${sc.ref}</div>`;
  if(S.phase==="explore"){
    let tip=t("tap");
    if(sc.walk){const st=walker.step;tip=st===2?`${t("name")} (${walker.named.length}/12)`:st===0?t("tap"):t("walk");}
    panel.innerHTML=`${head}<p class="story">${esc(L(sc.nar))}</p>
      <div class="row"><button class="btn quiet" id="listen" type="button">🔊 ${t("listen")}</button><p class="tip" id="tip">${esc(tip)}</p></div>`;
    panel.querySelector("#listen").onclick=()=>say(L(sc.nar));
    return;
  }
  if(S.phase==="q"){
    const q=sc.qs[S.qi];
    const hint=S.wrong.length?`<p class="hint"><b>${t("hintT")}:</b> ${esc(L(q.hint))}</p>`:"";
    panel.innerHTML=`${head}<h2>${esc(L(q.q))}</h2>
      <div class="answers">${S.opts.map(k=>{const a=q.a[k];const cls=S.wrong.includes(k)?" no":(justRight===k?" yes":"");return `<button class="ans${cls}" type="button" data-k="${k}"${S.wrong.includes(k)?' aria-disabled="true"':""}><span class="pic" aria-hidden="true">${a.p}</span>${esc(L(a))}</button>`;}).join("")}</div>
      ${hint}<div class="row"><button class="btn quiet" id="listen" type="button">🔊 ${t("listen")}</button></div>`;
    panel.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    panel.querySelector("#listen").onclick=()=>say(L(q.q));
    return;
  }
  panel.innerHTML=`${head}<div class="won"><div class="big">${sc.day}</div><div><div class="eyebrow">${t("card")}</div><h2>${esc(L(sc.card))}</h2></div></div>
    <div class="row"><button class="btn" id="next" type="button">${S.i<7?t("next"):t("doneT")} →</button></div>`;
  panel.querySelector("#next").onclick=next;
}

/* ---------- grown-ups (adult gate) ---------- */
const dlg=document.getElementById("adult"),body=document.getElementById("adultBody");
function openAdult(){
  const a=11+Math.floor(Math.random()*8),b=6+Math.floor(Math.random()*7);
  body.innerHTML=`<h3>For grown-ups</h3><p>Answer to continue: what is ${a} + ${b}?</p>
    <form id="gate" class="row"><input id="gateIn" inputmode="numeric" autocomplete="off" aria-label="Answer" style="width:90px"><button class="btn" type="submit">Open</button><button class="btn quiet" type="button" id="gateX">Close</button></form><p class="tip" id="gateMsg"></p>`;
  body.querySelector("#gateX").onclick=()=>dlg.close();
  body.querySelector("#gate").onsubmit=e=>{e.preventDefault();if(+body.querySelector("#gateIn").value===a+b)adultPanel();else body.querySelector("#gateMsg").textContent="Not quite. Try again.";};
  dlg.showModal();
}
function adultPanel(){
  body.innerHTML=`<h3>For grown-ups</h3>
    <ul class="list">
      <li>Demo build of Chapter 1 (Genesis 1:1–2:3). Story text is a draft and not yet signed off.</li>
      <li>Progress stays on this device. No accounts, ads or tracking.</li>
      <li>Read-aloud uses this device’s own voice.</li>
      <li>Animal stickers named: ${S.stickers.length} of 12.</li>
      <li>Art is placeholder for the demo.</li>
    </ul>
    <div class="row" style="margin-top:14px"><button class="btn quiet" id="reset" type="button">Reset progress</button><button class="btn" id="done" type="button">Done</button></div><p class="tip" id="resetMsg"></p>`;
  body.querySelector("#done").onclick=()=>dlg.close();
  body.querySelector("#reset").onclick=e=>{
    if(e.target.dataset.sure){S.cards=[];S.stickers=[];S.best=0;S.screen="start";world.v=world.target=0;save();renderPanel();dlg.close();}
    else{e.target.dataset.sure="1";e.target.textContent="Tap again to reset";}
  };
}

/* ---------- wiring ---------- */
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect();onWorldTap((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);});
document.getElementById("langBtn").onclick=()=>{S.lang=S.lang==="en"?"es":"en";save();renderPanel();};
document.getElementById("soundBtn").onclick=()=>{S.sound=!S.sound;if(!S.sound)try{speechSynthesis.cancel();}catch(e){}save();renderCards();};
document.getElementById("adultBtn").onclick=openAdult;

/* playtest adapter */
window.ARCA={
  state:()=>({screen:S.screen,scene:S.i+1,phase:S.phase,question:S.qi,cards:S.cards.length,world:+world.v.toFixed(2),walkStep:walker.step,named:walker.named.length,lang:S.lang}),
  start:()=>{S.cards=[];S.best=0;world.v=0;enter(0);},
  tapSpot:()=>{const sc=SCENES[S.i];if(!sc.walk){world.v=world.target;reveal();}},
  answerRight:()=>{const q=SCENES[S.i].qs[S.qi];return answer(q.a.findIndex(a=>a.ok));},
  answerWrong:()=>{const q=SCENES[S.i].qs[S.qi];return answer(q.a.findIndex((a,k)=>!a.ok&&!S.wrong.includes(k)));},
  next:()=>next(),
  tap:(x,y)=>onWorldTap(x,y)
};

renderPanel();
requestAnimationFrame(draw);
})();
</script>
